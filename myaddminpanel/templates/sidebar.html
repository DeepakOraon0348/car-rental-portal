<div class="sidebar">
  <div class="logo">
    <h2>🚗 DriveX</h2>
  </div>

  <ul>
    <li class="active">
      <i class="fa-solid fa-house"></i>
      Dashboard
    </li>
    <li class="add-car">
      <a href="{% url 'add_driver' %}" style="text-decoration: none; color: inherit;">
        <i class="fa-solid fa-plus"></i>
        Add Car
      </a>
    </li>

    <li>
    <a href="#" style="text-decoration: none; color: inherit;">
      <i class="fa-solid fa-car"></i>
      My Cars
    </a>
    </li>

    <li>
      <a href="{% url 'book_history' %}" style="text-decoration: none; color: inherit;">
      <i class="fa-solid fa-calendar-check"></i>
      Bookings
      </a>
    </li>

    <li>
      <i class="fa-solid fa-user"></i>
      {% if request.session.vendor_name %}
        {{ request.session.vendor_name|title }}
      {% else %}
        Profile
      {% endif %}
    </li>

    <li>
      <form method="POST" action="{% url 'logout_1' %}" style="margin: 0; padding: 0;">
        {% csrf_token %}
        <button type="submit">
          <i class="fa-solid fa-right-from-bracket"></i>
          Logout
        </button>
      </form>
    </li>
  </ul>
</div>
