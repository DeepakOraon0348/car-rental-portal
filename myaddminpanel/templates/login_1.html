{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Car Rental Portal</title>

    <link rel="stylesheet" href="{% static 'css/style_1.css' %}">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Left Section -->
    <div class="left-section">

        <div class="overlay">
            <h1>Drive Your Dream Car</h1>

            <p>
                Book premium cars from trusted local vendors
                anytime, anywhere.
            </p>
        </div>

    </div>

    <!-- Right Section -->
    <div class="right-section">

        <div class="login-card">

            <h2>Welcome Back 👋</h2>

            <p>Login to continue</p>

            <form method="POST">
                {% csrf_token %}

                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input
                        type="email"
                        name="email"
                        placeholder="Email Address"
                        required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required>
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <div class="bottom-text">
                Don't have an account?
                <a href="{% url 'signup' %}">
                    Register
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
